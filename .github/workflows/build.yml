name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: swipetoclear16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate settings icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode(Path('assets/SwipeToClear16.png.b64').read_text())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/SwipeToClear16.png'),
              Path('SwipeToClear16Prefs/layout/Library/PreferenceLoader/Preferences/SwipeToClear16.png'),
              Path('SwipeToClear16Prefs/Resources/icon.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeToClear16-rootless-v1.0.14
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.14
          name: SwipeToClear16 v1.0.14
          body: |
            Fixes the SwipeToClear16 icon in the iOS Settings tweak list.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
