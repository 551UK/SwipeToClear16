name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: swipetoclear16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeToClear16-rootless-v1.0.9
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.9
          name: SwipeToClear16 v1.0.9
          body: |
            Keeps the working no-tuck behavior from v1.0.8.
            Moves the clear gesture to the full Lock Screen container so a downward swipe can clear from below the notification list as well as on top of it.
            Keeps simultaneous system gestures, the short configurable distance, haptic feedback and Lock Screen Search suppression.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
